<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3157d5">
<meta name="description" content="KasKita Profesional — pencatatan kas, pelanggan, transaksi, stok, dan agenda.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>KasKita — Manajemen Usaha</title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--ink:#172033;--muted:#758096;--line:#e6eaf1;--brand:#3157d5;--brand2:#2444b3;--green:#15966a;--red:#d84b5b;--amber:#b7791f;--shadow:0 8px 26px rgba(30,45,80,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:650;transition:.15s}button:hover{transform:translateY(-1px)}.primary{background:var(--brand);color:white}.primary:hover{background:var(--brand2)}.secondary{background:#edf1ff;color:#2949bd}.ghost{background:#f3f5f9;color:#46516a}.danger{background:#fff0f1;color:var(--red)}.wa{background:#e5f8ee;color:#118452}.small{padding:7px 10px;font-size:12px}.app{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.sidebar{background:#111a2d;color:#e8edfa;padding:24px 16px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:11px;padding:0 9px}.brandmark{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#6d8aff,#3157d5);display:grid;place-items:center;font-size:20px;font-weight:900}.brand strong{font-size:18px;letter-spacing:.2px}.brand small{display:block;color:#9daac6;font-size:11px;margin-top:2px}.navlabel{font-size:10px;letter-spacing:1.4px;color:#8491ae;padding:0 12px;margin-bottom:-12px}.nav{display:grid;gap:5px}.nav button{color:#b9c4dc;text-align:left;background:transparent;padding:12px;border-radius:10px;display:flex;align-items:center;gap:12px;font-weight:550}.nav button.active,.nav button:hover{background:#263554;color:white}.nav .ico{width:20px;text-align:center;font-size:16px}.sidefoot{margin-top:auto;border-top:1px solid #2c3851;padding:16px 8px 0;color:#9daac6;font-size:12px}.main{min-width:0}.topbar{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:5}.topbar h1{font-size:21px;margin:0}.topbar p{margin:3px 0 0;color:var(--muted);font-size:12px}.topactions{display:flex;gap:9px;align-items:center}.datepill{color:#66718a;background:#f5f7fb;border:1px solid var(--line);padding:9px 12px;border-radius:10px;font-size:12px}.content{padding:27px 32px 45px;max-width:1500px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:22px}.pagehead h2{font-size:20px;margin:0 0 4px}.pagehead p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.metric{padding:20px}.metrichead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.metricicon{width:35px;height:35px;display:grid;place-items:center;background:#eef2ff;border-radius:11px;font-size:17px}.metric strong{font-size:25px;display:block;margin:12px 0 4px;letter-spacing:-.5px}.metric small{color:var(--muted);font-size:11px}.green{color:var(--green)!important}.red{color:var(--red)!important}.grid2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,1fr);gap:18px}.panel{padding:21px;margin-bottom:18px;min-width:0}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:17px}.panelhead h3{margin:0;font-size:15px}.panelhead p{margin:3px 0 0;color:var(--muted);font-size:12px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th{text-align:left;color:#8993a6;font-size:10px;letter-spacing:.65px;text-transform:uppercase;font-weight:750;padding:11px 10px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid #f0f2f6;font-size:12px}tbody tr:last-child td{border-bottom:0}.empty{text-align:center;color:var(--muted);padding:32px 12px}.badge{display:inline-block;border-radius:20px;padding:4px 8px;font-size:10px;font-weight:750;background:#edf1f7;color:#67718a}.badge.in{background:#e3f8ed;color:#128155}.badge.out{background:#fff0f1;color:#c43c4c}.badge.pending{background:#fff5dd;color:#986a10}.search{width:100%;max-width:270px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}.search:focus,input:focus,select:focus,textarea:focus{border-color:#8ba0ff;box-shadow:0 0 0 3px #3157d51a;outline:none}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.filters select,.filters input{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}.activity{display:grid;gap:15px}.activityitem{display:flex;gap:12px;align-items:flex-start}.activitydot{width:35px;height:35px;border-radius:11px;display:grid;place-items:center;background:#eef2ff;flex-shrink:0}.activityitem strong{display:block;font-size:12px}.activityitem small{color:var(--muted);font-size:11px}.amount{font-weight:750}.quickgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick{padding:14px;border:1px solid var(--line);background:#fff;text-align:left;border-radius:12px;color:var(--ink)}.quick span{display:block;font-size:19px;margin-bottom:7px}.quick small{display:block;color:var(--muted);font-weight:450;margin-top:3px}.notice{background:#f0f4ff;color:#3851a7;padding:13px 15px;border-radius:11px;font-size:12px;margin-bottom:18px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#4d5870}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe4ed;border-radius:9px;padding:11px 12px;background:#fff;color:var(--ink)}.field textarea{min-height:78px;resize:vertical}.modalback{position:fixed;inset:0;background:#111a2d80;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modalback.show{display:flex}.modal{background:white;border-radius:17px;width:min(650px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 70px #111a2d40}.modalhead{padding:20px 23px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modalhead h3{margin:0;font-size:17px}.modalbody{padding:22px 23px}.modalfoot{padding:16px 23px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}.close{background:transparent;color:#758096;font-size:22px;padding:0 5px}.toast{position:fixed;bottom:22px;right:22px;background:#172033;color:white;padding:13px 17px;border-radius:11px;box-shadow:var(--shadow);z-index:40;display:none}.toast.show{display:block;animation:pop .2s}@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}.invoice{border:1px dashed #cbd3e1;border-radius:12px;padding:20px;background:#fff}.invoice h2{margin:0}.invoice .invtop{display:flex;justify-content:space-between;gap:15px;padding-bottom:16px;border-bottom:1px solid var(--line)}.invoice .invtotal{text-align:right;font-size:22px;font-weight:800;margin-top:16px}.agendaitem{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}.agendaDate{width:52px;height:54px;border-radius:11px;background:#eef2ff;display:grid;place-content:center;text-align:center;flex-shrink:0;color:#3157d5}.agendaDate strong{font-size:18px;line-height:1.1}.agendaDate small{font-size:10px;text-transform:uppercase}.agendaitem h4{margin:2px 0 4px;font-size:13px}.agendaitem p{margin:0;color:var(--muted);font-size:11px}.settingsbox{max-width:720px}.footerhint{color:var(--muted);font-size:11px;margin-top:16px;line-height:1.6}.mobilemenu{display:none}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:22px}.topbar{padding:0 22px}.grid2{grid-template-columns:1fr}}
@media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{padding:12px;gap:10px}.brand{padding:4px 8px}.brandmark{width:34px;height:34px}.navlabel,.sidefoot{display:none}.nav{display:flex;overflow-x:auto;padding-bottom:2px}.nav button{white-space:nowrap;padding:9px 11px;font-size:12px}.nav .ico{font-size:14px}.topbar{height:auto;min-height:68px;padding:14px 17px}.topbar h1{font-size:18px}.datepill{display:none}.content{padding:18px 14px 32px}.cards{gap:10px}.metric{padding:14px}.metric strong{font-size:19px}.metricicon{width:30px;height:30px}.pagehead{align-items:flex-start;flex-direction:column}.panel{padding:15px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.search{max-width:100%}.topactions .secondary{display:none}}
@media print{body{background:white}.sidebar,.topbar,.pagehead,.no-print,.modalhead,.modalfoot{display:none!important}.app{display:block}.content{padding:0}.modalback{display:block;position:static;background:white;padding:0}.modal{box-shadow:none;width:100%;max-height:none}.modalbody{padding:0}.invoice{border:0}.panel{box-shadow:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brandmark">K</div><div><strong>KasKita</strong><small>Manajemen usaha sederhana</small></div></div>
  <div class="navlabel">MENU UTAMA</div>
  <nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span> Dashboard</button>
    <button data-page="kas"><span class="ico">↔</span> Kas Keuangan</button>
    <button data-page="pelanggan"><span class="ico">♙</span> Data Pelanggan</button>
    <button data-page="nota"><span class="ico">▤</span> Nota Transaksi</button>
    <button data-page="agenda"><span class="ico">◷</span> Agenda & Pengingat</button>
    <button data-page="inventaris"><span class="ico">▣</span> Inventaris Barang</button>
    <button data-page="laporan"><span class="ico">▤</span> Laporan Keuangan</button>
    <button data-page="pengaturan"><span class="ico">⚙</span> Pengaturan & Backup</button>
  </nav>
  <div class="sidefoot">Data disimpan di browser perangkat ini.<br>Ekspor backup secara berkala.</div>
</aside>
<main class="main">
<header class="topbar"><div><h1 id="topTitle">Dashboard</h1><p id="todayText">Ringkasan aktivitas usaha Anda</p></div><div class="topactions"><span class="datepill" id="datePill"></span><button class="primary" onclick="openTransaction()">＋ Transaksi</button></div></header>
<div class="content" id="content"></div>
</main>
</div>
<div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h3 id="modalTitle">Form</h3><button class="close" onclick="closeModal()">×</button></div><div class="modalbody" id="modalBody"></div><div class="modalfoot" id="modalFoot"><button class="ghost" onclick="closeModal()">Batal</button><button class="primary" id="modalSave">Simpan</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const DBKEY='kaskita_db_v1';
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const blank=()=>({business:'Usaha Saya',owner:'',phone:'',address:'',currency:'IDR',customers:[],transactions:[],agenda:[],products:[]});
let db;try{db={...blank(),...(JSON.parse(localStorage.getItem(DBKEY))||{})};db.products ||= []}catch(e){db=blank()}
function save(){localStorage.setItem(DBKEY,JSON.stringify(db))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}
function dateFmt(s){if(!s)return '—';let d=new Date(s+'T00:00:00');return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}
function dtFmt(s){if(!s)return '—';let d=new Date(s);return isNaN(d)?s:d.toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
function waLink(phone,message=''){let p=String(phone||'').replace(/\D/g,'');if(p.startsWith('0'))p='62'+p.slice(1);if(p.startsWith('8'))p='62'+p;if(!p)return '#';return 'https://wa.me/'+p+(message?'?text='+encodeURIComponent(message):'')}
function customerName(id){return db.customers.find(c=>c.id===id)?.name||'Pelanggan umum'}
function transTotal(t){return Number(t.amount)||0}
function calc(){let now=today(),income=0,expense=0;db.transactions.forEach(t=>{if(t.date?.slice(0,7)===now.slice(0,7)){if(t.type==='in')income+=transTotal(t);else expense+=transTotal(t)}});return {income,expense,balance:db.transactions.reduce((a,t)=>a+(t.type==='in'?transTotal(t):-transTotal(t)),0)}}
const pages={dashboard:'Dashboard',kas:'Kas Keuangan',pelanggan:'Data Pelanggan',nota:'Nota Transaksi',agenda:'Agenda & Pengingat',inventaris:'Inventaris Barang',laporan:'Laporan Keuangan',pengaturan:'Pengaturan & Backup'};
let page='dashboard';
document.getElementById('datePill').textContent=new Date().toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
document.getElementById('todayText').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('topTitle').textContent=pages[p];render()}
function render(){let el=document.getElementById('content');({dashboard:renderDashboard,kas:renderKas,pelanggan:renderCustomers,nota:renderInvoices,agenda:renderAgenda,inventaris:renderInventory,laporan:renderReports,pengaturan:renderSettings}[page]||renderDashboard)(el)}
function emptyRow(n,msg){return `<tr><td colspan="${n}" class="empty">${msg}</td></tr>`}
function renderDashboard(el){let c=calc(),recent=[...db.transactions].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,6),next=[...db.agenda].filter(a=>a.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,4);
el.innerHTML=`<div class="pagehead"><div><h2>Selamat datang di KasKita 👋</h2><p>Semua catatan usaha Anda, dalam satu tempat.</p></div><div class="actions"><button class="secondary" onclick="openCustomer()">＋ Pelanggan</button><button class="primary" onclick="openTransaction()">＋ Catat transaksi</button></div></div>
<div class="cards">
<div class="card metric"><div class="metrichead">Saldo keseluruhan <span class="metricicon">◈</span></div><strong>${money(c.balance)}</strong><small>Akumulasi pemasukan dikurangi pengeluaran</small></div>
<div class="card metric"><div class="metrichead">Pemasukan bulan ini <span class="metricicon">↗</span></div><strong class="green">${money(c.income)}</strong><small>Transaksi masuk bulan berjalan</small></div>
<div class="card metric"><div class="metrichead">Pengeluaran bulan ini <span class="metricicon">↙</span></div><strong class="red">${money(c.expense)}</strong><small>Transaksi keluar bulan berjalan</small></div>
<div class="card metric"><div class="metrichead">Total pelanggan <span class="metricicon">♙</span></div><strong>${db.customers.length}</strong><small>Kontak tersimpan</small></div></div>
<div class="grid2"><section class="panel"><div class="panelhead"><div><h3>Transaksi terbaru</h3><p>Aktivitas keuangan terakhir</p></div><button class="ghost small" onclick="go('kas')">Lihat semua →</button></div><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Kategori</th><th>Jumlah</th></tr></thead><tbody>${recent.length?recent.map(t=>`<tr><td>${dateFmt(t.date)}</td><td><b>${esc(t.note||'Transaksi')}</b><br><small>${esc(customerName(t.customerId))}</small></td><td>${esc(t.category||'Umum')}</td><td class="amount ${t.type==='in'?'green':'red'}">${t.type==='in'?'+':'−'}${money(t.amount)}</td></tr>`).join(''):emptyRow(4,'Belum ada transaksi. Mulai catat pemasukan atau pengeluaran.')}</tbody></table></div></section>
<section class="panel"><div class="panelhead"><div><h3>Akses cepat</h3><p>Pekerjaan yang sering dilakukan</p></div></div><div class="quickgrid"><button class="quick" onclick="openTransaction('in')"><span>↗</span><b>Pemasukan</b><small>Catat uang masuk</small></button><button class="quick" onclick="openTransaction('out')"><span>↙</span><b>Pengeluaran</b><small>Catat uang keluar</small></button><button class="quick" onclick="openCustomer()"><span>♙</span><b>Pelanggan baru</b><small>Simpan kontak</small></button><button class="quick" onclick="openAgenda()"><span>◷</span><b>Buat pengingat</b><small>Agenda & jadwal</small></button></div></section></div>
<div class="grid2"><section class="panel"><div class="panelhead"><div><h3>Agenda mendatang</h3><p>Jadwal dan pengingat yang akan datang</p></div><button class="ghost small" onclick="go('agenda')">Lihat agenda →</button></div>${next.length?next.map(a=>agendaCard(a)).join(''):'<div class="empty">Belum ada agenda mendatang.</div>'}</section><section class="panel"><div class="panelhead"><div><h3>Catatan penting</h3><p>Supaya data tetap aman</p></div></div><div class="notice">💡 Data tersimpan di browser perangkat ini. Gunakan menu <b>Pengaturan & Backup</b> untuk mengunduh salinan data.</div><div class="activity"><div class="activityitem"><div class="activitydot">✓</div><div><strong>Database pelanggan</strong><small>${db.customers.length} kontak telah tersimpan.</small></div></div><div class="activityitem"><div class="activitydot">▤</div><div><strong>Nota transaksi</strong><small>${db.transactions.filter(t=>t.invoice).length} transaksi memiliki nomor nota.</small></div></div></div></section></div>`}
function renderKas(el){let rows=[...db.transactions].sort((a,b)=>(b.date||'').localeCompare(a.date||''));el.innerHTML=`<div class="pagehead"><div><h2>Buku kas</h2><p>Catat dan pantau pemasukan serta pengeluaran usaha.</p></div><button class="primary" onclick="openTransaction()">＋ Tambah transaksi</button></div><div class="cards">${(()=>{let c=calc();return `<div class="card metric"><div class="metrichead">Saldo keseluruhan</div><strong>${money(c.balance)}</strong></div><div class="card metric"><div class="metrichead">Pemasukan bulan ini</div><strong class="green">${money(c.income)}</strong></div><div class="card metric"><div class="metrichead">Pengeluaran bulan ini</div><strong class="red">${money(c.expense)}</strong></div><div class="card metric"><div class="metrichead">Jumlah transaksi</div><strong>${db.transactions.length}</strong></div>`})()}</div><section class="panel"><div class="filters"><input class="search" id="kasSearch" placeholder="Cari keterangan/kategori..." oninput="filterKas()"><select id="kasType" onchange="filterKas()"><option value="">Semua jenis</option><option value="in">Pemasukan</option><option value="out">Pengeluaran</option></select><input type="month" id="kasMonth" value="${today().slice(0,7)}" onchange="filterKas()"><button class="ghost" onclick="document.getElementById('kasMonth').value='';filterKas()">Semua tanggal</button></div><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Nomor nota</th><th>Keterangan</th><th>Kategori</th><th>Pelanggan</th><th>Jenis</th><th>Jumlah</th><th>Aksi</th></tr></thead><tbody id="kasRows"></tbody></table></div></section>`;filterKas()}
function filterKas(){let target=document.getElementById('kasRows');if(!target)return;let q=document.getElementById('kasSearch').value.toLowerCase(),type=document.getElementById('kasType').value,month=document.getElementById('kasMonth').value;let rows=[...db.transactions].filter(t=>(!q||`${t.note} ${t.category} ${t.invoice}`.toLowerCase().includes(q))&&(!type||t.type===type)&&(!month||t.date?.startsWith(month))).sort((a,b)=>(b.date||'').localeCompare(a.date||''));target.innerHTML=rows.length?rows.map(t=>`<tr><td>${dateFmt(t.date)}</td><td>${esc(t.invoice||'—')}</td><td><b>${esc(t.note||'Transaksi')}</b></td><td>${esc(t.category||'Umum')}</td><td>${esc(customerName(t.customerId))}</td><td><span class="badge ${t.type}">${t.type==='in'?'Pemasukan':'Pengeluaran'}</span></td><td class="amount ${t.type==='in'?'green':'red'}">${t.type==='in'?'+':'−'}${money(t.amount)}</td><td><div class="actions"><button class="secondary small" onclick="showInvoice('${t.id}')">Nota</button><button class="danger small" onclick="deleteTransaction('${t.id}')">Hapus</button></div></td></tr>`).join(''):emptyRow(8,'Tidak ada transaksi yang cocok.') }
function renderCustomers(el){el.innerHTML=`<div class="pagehead"><div><h2>Database pelanggan</h2><p>Simpan kontak, riwayat, dan hubungi pelanggan lewat WhatsApp.</p></div><button class="primary" onclick="openCustomer()">＋ Tambah pelanggan</button></div><section class="panel"><div class="filters"><input class="search" id="custSearch" placeholder="Cari nama, nomor, atau email..." oninput="filterCustomers()"><span class="datepill">${db.customers.length} pelanggan tersimpan</span></div><div class="tablewrap"><table><thead><tr><th>Nama pelanggan</th><th>WhatsApp</th><th>Email</th><th>Alamat</th><th>Total transaksi</th><th>Aksi</th></tr></thead><tbody id="custRows"></tbody></table></div></section>`;filterCustomers()}
function filterCustomers(){let target=document.getElementById('custRows');if(!target)return;let q=document.getElementById('custSearch').value.toLowerCase();let rows=db.customers.filter(c=>`${c.name} ${c.phone} ${c.email} ${c.address}`.toLowerCase().includes(q));target.innerHTML=rows.length?rows.map(c=>{let n=db.transactions.filter(t=>t.customerId===c.id).length;return `<tr><td><b>${esc(c.name)}</b><br><small>${esc(c.note||'')}</small></td><td>${esc(c.phone||'—')}</td><td>${esc(c.email||'—')}</td><td>${esc(c.address||'—')}</td><td>${n}</td><td><div class="actions">${c.phone?`<a class="wa" style="text-decoration:none;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700" target="_blank" rel="noopener" href="${waLink(c.phone,'Halo '+c.name+', kami dari '+db.business+'.')}">WhatsApp ↗</a>`:''}<button class="secondary small" onclick="openCustomer('${c.id}')">Edit</button><button class="danger small" onclick="deleteCustomer('${c.id}')">Hapus</button></div></td></tr>`}).join(''):emptyRow(6,'Belum ada pelanggan. Tambahkan kontak pelanggan pertama Anda.')}
function renderInvoices(el){let rows=[...db.transactions].filter(t=>t.invoice).sort((a,b)=>(b.date||'').localeCompare(a.date||''));el.innerHTML=`<div class="pagehead"><div><h2>Nota transaksi</h2><p>Lihat, cetak, dan bagikan nota transaksi kepada pelanggan.</p></div><button class="primary" onclick="openTransaction()">＋ Buat nota baru</button></div><section class="panel"><div class="filters"><input class="search" id="invSearch" placeholder="Cari nomor nota / pelanggan..." oninput="filterInvoices()"></div><div class="tablewrap"><table><thead><tr><th>No. nota</th><th>Tanggal</th><th>Pelanggan</th><th>Keterangan</th><th>Total</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="invRows"></tbody></table></div></section>`;filterInvoices()}
function filterInvoices(){let target=document.getElementById('invRows');if(!target)return;let q=document.getElementById('invSearch').value.toLowerCase();let rows=db.transactions.filter(t=>t.invoice&&`${t.invoice} ${customerName(t.customerId)} ${t.note}`.toLowerCase().includes(q)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));target.innerHTML=rows.length?rows.map(t=>`<tr><td><b>${esc(t.invoice)}</b></td><td>${dateFmt(t.date)}</td><td>${esc(customerName(t.customerId))}</td><td>${esc(t.note||'—')}</td><td class="amount">${money(t.amount)}</td><td><span class="badge ${t.paid?'in':'pending'}">${t.paid?'Lunas':'Belum lunas'}</span></td><td><div class="actions"><button class="secondary small" onclick="showInvoice('${t.id}')">Lihat / Cetak</button><button class="ghost small" onclick="togglePaid('${t.id}')">${t.paid?'Tandai belum lunas':'Tandai lunas'}</button></div></td></tr>`).join(''):emptyRow(7,'Belum ada nota. Buat transaksi dengan opsi “Buat nota”.')}
function agendaCard(a){let d=new Date(a.date+'T00:00:00');return `<div class="agendaitem"><div class="agendaDate"><strong>${d.getDate()}</strong><small>${d.toLocaleDateString('id-ID',{month:'short'})}</small></div><div style="flex:1"><h4>${esc(a.title)}</h4><p>${esc(a.time||'Sepanjang hari')} · ${esc(a.type||'Agenda')}${a.customerId?' · '+esc(customerName(a.customerId)):''}</p>${a.note?`<p style="margin-top:5px">${esc(a.note)}</p>`:''}</div><button class="danger small" onclick="deleteAgenda('${a.id}')">Hapus</button></div>`}
function renderAgenda(el){let rows=[...db.agenda].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));el.innerHTML=`<div class="pagehead"><div><h2>Agenda & pengingat</h2><p>Atur jadwal temu, penagihan, tindak lanjut, dan pengingat pribadi.</p></div><button class="primary" onclick="openAgenda()">＋ Tambah agenda</button></div><div class="notice">🔔 Pengingat tersimpan di aplikasi ini. Browser tidak otomatis mengirim notifikasi saat aplikasi tertutup; izinkan notifikasi browser atau pasang pengingat kalender terpisah bila diperlukan.</div><section class="panel"><div class="panelhead"><div><h3>Semua agenda</h3><p>${rows.length} agenda tersimpan</p></div><button class="ghost small" onclick="requestNotifications()">Aktifkan notifikasi browser</button></div>${rows.length?rows.map(a=>agendaCard(a)).join(''):'<div class="empty">Belum ada agenda. Buat pengingat pertama Anda.</div>'}</section>`}

function renderInventory(el){
 const products=db.products||[];
 el.innerHTML=`<div class="pagehead"><div><h2>Inventaris barang</h2><p>Kelola stok, harga modal, harga jual, dan nilai persediaan.</p></div><button class="primary" onclick="openProduct()">＋ Tambah barang</button></div>
 <div class="cards"><div class="card metric"><div class="metrichead">Jenis barang</div><strong>${products.length}</strong></div><div class="card metric"><div class="metrichead">Total unit stok</div><strong>${products.reduce((s,p)=>s+Number(p.stock||0),0)}</strong></div><div class="card metric"><div class="metrichead">Nilai modal stok</div><strong>${money(products.reduce((s,p)=>s+Number(p.stock||0)*Number(p.cost||0),0))}</strong></div><div class="card metric"><div class="metrichead">Stok menipis</div><strong class="${products.filter(p=>Number(p.stock)<=Number(p.min||0)).length?'red':''}">${products.filter(p=>Number(p.stock)<=Number(p.min||0)).length}</strong></div></div>
 <section class="panel"><div class="filters"><input class="search" id="productSearch" placeholder="Cari nama / SKU..." oninput="filterProducts()"></div><div class="tablewrap"><table><thead><tr><th>Nama barang</th><th>SKU</th><th>Stok</th><th>Stok minimum</th><th>Harga modal</th><th>Harga jual</th><th>Nilai stok</th><th>Aksi</th></tr></thead><tbody id="productRows"></tbody></table></div></section>`;
 filterProducts();
}
function filterProducts(){let target=document.getElementById('productRows');if(!target)return;let q=document.getElementById('productSearch').value.toLowerCase();let rows=(db.products||[]).filter(p=>(p.name+' '+p.sku).toLowerCase().includes(q));target.innerHTML=rows.length?rows.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.sku||'—')}</td><td class="${Number(p.stock)<=Number(p.min||0)?'red':''}"><b>${Number(p.stock)||0}</b></td><td>${Number(p.min)||0}</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td>${money(Number(p.stock||0)*Number(p.cost||0))}</td><td><div class="actions"><button class="secondary small" onclick="openProduct('${p.id}')">Edit</button><button class="ghost small" onclick="adjustStock('${p.id}')">Ubah stok</button><button class="danger small" onclick="deleteProduct('${p.id}')">Hapus</button></div></td></tr>`).join(''):emptyRow(8,'Belum ada barang inventaris.')}
function openProduct(id=''){let p=(db.products||[]).find(x=>x.id===id)||{};let body=`<form id="productForm" class="formgrid" onsubmit="event.preventDefault();saveProduct('${id}')"><div class="field full"><label>Nama barang *</label><input name="name" required value="${esc(p.name||'')}"></div><div class="field"><label>SKU / Kode barang</label><input name="sku" value="${esc(p.sku||'')}"></div><div class="field"><label>Stok saat ini *</label><input name="stock" type="number" min="0" required value="${p.stock??0}"></div><div class="field"><label>Stok minimum</label><input name="min" type="number" min="0" value="${p.min??0}"></div><div class="field"><label>Harga modal (Rp)</label><input name="cost" type="number" min="0" value="${p.cost??0}"></div><div class="field"><label>Harga jual (Rp)</label><input name="price" type="number" min="0" value="${p.price??0}"></div></form>`;openModal(id?'Edit barang':'Tambah barang',body,()=>saveProduct(id))}
function saveProduct(id){let f=document.getElementById('productForm');if(!f.reportValidity())return;let d=Object.fromEntries(new FormData(f));d.stock=Number(d.stock);d.min=Number(d.min);d.cost=Number(d.cost);d.price=Number(d.price);if(id)Object.assign(db.products.find(x=>x.id===id),d);else db.products.push({id:uid(),...d});save();closeModal();render();toast('Inventaris disimpan.')}
function adjustStock(id){let p=db.products.find(x=>x.id===id);if(!p)return;let v=prompt(`Stok saat ini: ${p.stock}\nMasukkan stok baru untuk ${p.name}:`,p.stock);if(v===null)return;if(v.trim()===''||!Number.isFinite(Number(v))||Number(v)<0){alert('Masukkan jumlah stok yang valid.');return}p.stock=Number(v);save();render();toast('Stok diperbarui.')}
function deleteProduct(id){if(!confirm('Hapus barang ini dari inventaris?'))return;db.products=db.products.filter(p=>p.id!==id);save();render();toast('Barang dihapus.')}
function renderReports(el){
 const months=[...new Set((db.transactions||[]).map(t=>(t.date||'').slice(0,7)).filter(Boolean))].sort().reverse();const month=months.includes(today().slice(0,7))?today().slice(0,7):(months[0]||today().slice(0,7));
 el.innerHTML=`<div class="pagehead"><div><h2>Laporan keuangan</h2><p>Ringkasan pemasukan, pengeluaran, arus kas, dan piutang.</p></div><button class="secondary" onclick="exportCSV()">⬇ Ekspor CSV</button></div><section class="panel"><div class="filters"><label style="align-self:center;font-weight:700">Periode laporan</label><input type="month" id="reportMonth" value="${month}" onchange="updateReport()"></div><div id="reportContent"></div></section>`;updateReport();
}
function updateReport(){let box=document.getElementById('reportContent');if(!box)return;let m=document.getElementById('reportMonth').value;let rows=db.transactions.filter(t=>(t.date||'').startsWith(m));let inc=rows.filter(t=>t.type==='in').reduce((s,t)=>s+Number(t.amount||0),0),out=rows.filter(t=>t.type==='out').reduce((s,t)=>s+Number(t.amount||0),0),paid=rows.filter(t=>t.type==='in'&&t.paid).reduce((s,t)=>s+Number(t.amount||0),0),unpaid=rows.filter(t=>t.type==='in'&&!t.paid).reduce((s,t)=>s+Number(t.amount||0),0);let cats={};rows.filter(t=>t.type==='out').forEach(t=>cats[t.category||'Lainnya']=(cats[t.category||'Lainnya']||0)+Number(t.amount||0));box.innerHTML=`<div class="cards"><div class="card metric"><div class="metrichead">Pemasukan</div><strong class="green">${money(inc)}</strong><small>${rows.filter(t=>t.type==='in').length} transaksi</small></div><div class="card metric"><div class="metrichead">Pengeluaran</div><strong class="red">${money(out)}</strong><small>${rows.filter(t=>t.type==='out').length} transaksi</small></div><div class="card metric"><div class="metrichead">Selisih kas periode</div><strong>${money(inc-out)}</strong><small>Pemasukan dikurangi pengeluaran</small></div><div class="card metric"><div class="metrichead">Belum lunas</div><strong class="${unpaid?'red':''}">${money(unpaid)}</strong><small>Tagihan pemasukan belum lunas</small></div></div><div class="grid2"><div><h3>Pengeluaran per kategori</h3><div class="tablewrap"><table><thead><tr><th>Kategori</th><th>Jumlah</th><th>Persentase</th></tr></thead><tbody>${Object.keys(cats).length?Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${money(v)}</td><td>${out?Math.round(v/out*100):0}%</td></tr>`).join(''):emptyRow(3,'Belum ada pengeluaran pada periode ini.')}</tbody></table></div></div><div><h3>Ringkasan pembayaran</h3><div class="activity"><div class="activityitem"><div class="activitydot">✓</div><div><strong>Tagihan lunas</strong><small>${money(paid)}</small></div></div><div class="activityitem"><div class="activitydot">◷</div><div><strong>Tagihan belum lunas</strong><small>${money(unpaid)}</small></div></div><div class="activityitem"><div class="activitydot">▤</div><div><strong>Total transaksi periode</strong><small>${rows.length} transaksi tercatat</small></div></div></div><p class="footerhint">Catatan: selisih kas bukan laporan laba rugi akuntansi lengkap. Pajak dan penyesuaian belum dihitung otomatis.</p></div></div>`;}

function renderSettings(el){el.innerHTML=`<div class="pagehead"><div><h2>Pengaturan & backup</h2><p>Identitas usaha dan keamanan data Anda.</p></div></div><section class="panel settingsbox"><div class="panelhead"><div><h3>Identitas usaha</h3><p>Informasi ini akan tampil pada nota.</p></div></div><form id="settingsForm" onsubmit="saveSettings(event)"><div class="formgrid"><div class="field"><label>Nama usaha</label><input name="business" required value="${esc(db.business)}"></div><div class="field"><label>Nama pemilik</label><input name="owner" value="${esc(db.owner)}"></div><div class="field"><label>Nomor WhatsApp usaha</label><input name="phone" inputmode="tel" value="${esc(db.phone)}" placeholder="08xxxxxxxxxx"></div><div class="field"><label>Mata uang</label><select name="currency"><option value="IDR">Rupiah (IDR)</option></select></div><div class="field full"><label>Alamat usaha</label><textarea name="address">${esc(db.address)}</textarea></div></div><div style="margin-top:16px"><button class="primary">Simpan pengaturan</button></div></form></section><section class="panel settingsbox"><div class="panelhead"><div><h3>Backup & pemulihan</h3><p>Ekspor data sebagai file JSON atau CSV. Simpan file backup di tempat aman.</p></div></div><div class="actions"><button class="primary" onclick="exportJSON()">⬇ Unduh backup lengkap (JSON)</button><button class="secondary" onclick="exportCSV()">⬇ Ekspor transaksi (CSV)</button><label class="ghost" style="padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:650">⬆ Pulihkan backup<input type="file" accept=".json,application/json" style="display:none" onchange="importJSON(event)"></label></div><p class="footerhint">Data tersimpan di browser perangkat ini, bukan server online. Ekspor backup secara rutin. Login, sinkronisasi multi-perangkat, dan pengingat otomatis saat aplikasi tertutup memerlukan backend/database online.</p><button class="danger" onclick="clearData()">Hapus semua data lokal</button></section>`}
function openModal(title,body,onSave,saveText='Simpan',hideFoot=false){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalSave').textContent=saveText;document.getElementById('modalFoot').style.display=hideFoot?'none':'flex';document.getElementById('modalback').classList.add('show');document.getElementById('modalSave').onclick=onSave}
function closeModal(){document.getElementById('modalback').classList.remove('show')}
function customerOptions(selected=''){return `<option value="">Pelanggan umum / tidak dipilih</option>`+db.customers.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.name)}</option>`).join('')}
function openTransaction(type='in'){let body=`<form id="transForm" class="formgrid" onsubmit="event.preventDefault();saveTransaction()"><div class="field"><label>Jenis transaksi *</label><select name="type"><option value="in" ${type==='in'?'selected':''}>Pemasukan</option><option value="out" ${type==='out'?'selected':''}>Pengeluaran</option></select></div><div class="field"><label>Tanggal *</label><input type="date" name="date" required value="${today()}"></div><div class="field full"><label>Keterangan transaksi *</label><input name="note" required placeholder="Contoh: Penjualan produk / bayar listrik"></div><div class="field"><label>Jumlah (Rp) *</label><input type="number" name="amount" min="1" required placeholder="150000"></div><div class="field"><label>Kategori</label><select name="category"><option>Penjualan</option><option>Jasa</option><option>Modal</option><option>Operasional</option><option>Transportasi</option><option>Gaji</option><option>Tagihan</option><option>Lainnya</option></select></div><div class="field"><label>Pelanggan</label><select name="customerId">${customerOptions()}</select></div><div class="field"><label>Nomor nota</label><input name="invoice" placeholder="Otomatis jika buat nota"></div><div class="field"><label>Status pembayaran</label><select name="paid"><option value="1">Lunas</option><option value="0">Belum lunas</option></select></div><div class="field"><label>Buat nota?</label><select name="makeInvoice"><option value="yes">Ya, buat nota</option><option value="no">Tidak</option></select></div><div class="field full"><label>Catatan tambahan</label><textarea name="memo" placeholder="Detail tambahan (opsional)"></textarea></div></form>`;
openModal('Catat transaksi',body,()=>{let f=document.getElementById('transForm');if(!f.reportValidity())return;saveTransaction()})}
function saveTransaction(){let f=document.getElementById('transForm');if(!f.reportValidity())return;let d=Object.fromEntries(new FormData(f));let make=d.makeInvoice==='yes';let inv=d.invoice.trim()||(make?'INV-'+today().replaceAll('-','')+'-'+String(db.transactions.length+1).padStart(3,'0'):'');db.transactions.push({id:uid(),type:d.type,date:d.date,note:d.note,amount:Number(d.amount),category:d.category,customerId:d.customerId,invoice:inv,paid:d.paid==='1',memo:d.memo});save();closeModal();render();toast('Transaksi berhasil disimpan.')}
function openCustomer(id=''){let c=db.customers.find(x=>x.id===id)||{};let body=`<form id="customerForm" class="formgrid" onsubmit="event.preventDefault();saveCustomer('${id}')"><div class="field full"><label>Nama pelanggan *</label><input name="name" required value="${esc(c.name||'')}" placeholder="Nama lengkap / nama usaha"></div><div class="field"><label>Nomor WhatsApp</label><input name="phone" inputmode="tel" value="${esc(c.phone||'')}" placeholder="08xxxxxxxxxx"></div><div class="field"><label>Email</label><input type="email" name="email" value="${esc(c.email||'')}"></div><div class="field full"><label>Alamat</label><textarea name="address">${esc(c.address||'')}</textarea></div><div class="field full"><label>Catatan pelanggan</label><textarea name="note">${esc(c.note||'')}</textarea></div></form>`;openModal(id?'Edit pelanggan':'Tambah pelanggan',body,()=>{let f=document.getElementById('customerForm');if(!f.reportValidity())return;saveCustomer(id)})}
function saveCustomer(id){let f=document.getElementById('customerForm');if(!f.reportValidity())return;let d=Object.fromEntries(new FormData(f));if(id){let c=db.customers.find(x=>x.id===id);Object.assign(c,d)}else db.customers.push({id:uid(),...d});save();closeModal();render();toast('Data pelanggan tersimpan.')}
function deleteCustomer(id){let c=db.customers.find(x=>x.id===id);if(!confirm(`Hapus pelanggan ${c?.name||''}? Riwayat transaksi tidak ikut dihapus.`))return;db.customers=db.customers.filter(x=>x.id!==id);save();render();toast('Pelanggan dihapus.')}
function deleteTransaction(id){if(!confirm('Hapus transaksi ini? Tindakan ini tidak dapat dibatalkan.'))return;db.transactions=db.transactions.filter(x=>x.id!==id);save();render();toast('Transaksi dihapus.')}
function togglePaid(id){let t=db.transactions.find(x=>x.id===id);if(t){t.paid=!t.paid;save();render();toast('Status pembayaran diperbarui.')}}
function showInvoice(id){let t=db.transactions.find(x=>x.id===id);if(!t)return;let c=db.customers.find(x=>x.id===t.customerId)||{};let msg=`Halo ${c.name||'Pelanggan'}, berikut nota ${t.invoice} dari ${db.business}. Keterangan: ${t.note}. Total: ${money(t.amount)}. Status: ${t.paid?'Lunas':'Belum lunas'}.`;let body=`<div class="invoice" id="printInvoice"><div class="invtop"><div><h2>${esc(db.business)}</h2><div style="color:#758096;font-size:12px;margin-top:5px">${esc(db.address||'')}<br>${esc(db.phone||'')}</div></div><div style="text-align:right"><b>NOTA TRANSAKSI</b><div style="margin-top:7px">${esc(t.invoice||'—')}</div><small>${dateFmt(t.date)}</small></div></div><div style="padding:18px 0"><small style="color:#758096">DITAGIHKAN KEPADA</small><h3 style="margin:4px 0">${esc(c.name||'Pelanggan umum')}</h3><small>${esc(c.phone||'')}${c.address?'<br>'+esc(c.address):''}</small></div><table><thead><tr><th>Deskripsi</th><th>Jenis</th><th>Jumlah</th></tr></thead><tbody><tr><td>${esc(t.note)}${t.memo?'<br><small>'+esc(t.memo)+'</small>':''}</td><td>${t.type==='in'?'Pemasukan':'Pengeluaran'}</td><td>${money(t.amount)}</td></tr></tbody></table><div class="invtotal">Total: ${money(t.amount)}</div><p style="text-align:right"><span class="badge ${t.paid?'in':'pending'}">${t.paid?'LUNAS':'BELUM LUNAS'}</span></p><p style="color:#758096;font-size:11px;margin-top:28px">Terima kasih atas kepercayaan Anda.</p></div><div class="actions no-print" style="margin-top:16px"><button class="primary" onclick="window.print()">Cetak / Simpan PDF</button>${c.phone?`<a class="wa" style="text-decoration:none;border-radius:9px;padding:10px 14px;font-weight:700" target="_blank" rel="noopener" href="${waLink(c.phone,msg)}">Kirim via WhatsApp ↗</a>`:''}<button class="secondary" onclick="closeModal()">Tutup</button></div>`;openModal('Pratinjau nota',body,()=>{},'',true)}
function openAgenda(){let body=`<form id="agendaForm" class="formgrid" onsubmit="event.preventDefault();saveAgenda()"><div class="field full"><label>Judul agenda / pengingat *</label><input name="title" required placeholder="Contoh: Follow up pembayaran"></div><div class="field"><label>Tanggal *</label><input name="date" type="date" required value="${today()}"></div><div class="field"><label>Waktu</label><input name="time" type="time" value="09:00"></div><div class="field"><label>Jenis agenda</label><select name="type"><option>Pengingat</option><option>Janji temu</option><option>Penagihan</option><option>Pengiriman</option><option>Tindak lanjut</option><option>Pribadi</option></select></div><div class="field"><label>Pelanggan terkait</label><select name="customerId">${customerOptions()}</select></div><div class="field full"><label>Catatan</label><textarea name="note" placeholder="Detail agenda..."></textarea></div></form>`;openModal('Tambah agenda & pengingat',body,()=>{let f=document.getElementById('agendaForm');if(!f.reportValidity())return;saveAgenda()})}
function saveAgenda(){let f=document.getElementById('agendaForm');if(!f.reportValidity())return;let d=Object.fromEntries(new FormData(f));db.agenda.push({id:uid(),...d});save();closeModal();render();toast('Agenda berhasil disimpan.')}
function deleteAgenda(id){if(!confirm('Hapus agenda ini?'))return;db.agenda=db.agenda.filter(a=>a.id!==id);save();render();toast('Agenda dihapus.')}
async function requestNotifications(){if(!('Notification'in window)){toast('Browser ini tidak mendukung notifikasi.');return}try{let p=await Notification.requestPermission();toast(p==='granted'?'Notifikasi diizinkan. Catatan: pengingat tetap perlu aplikasi terbuka.':'Izin notifikasi tidak diberikan.')}catch(e){toast('Tidak dapat meminta izin notifikasi.')} }
function saveSettings(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));Object.assign(db,d);save();render();toast('Pengaturan usaha disimpan.')}
function download(name,content,type){let b=new Blob([content],{type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href)}
function exportJSON(){download('kaskita-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json');toast('Backup berhasil diunduh.')}
function csvEscape(v){return '"'+String(v??'').replaceAll('"','""')+'"'}
function exportCSV(){let rows=[['Tanggal','Nomor Nota','Jenis','Keterangan','Kategori','Pelanggan','Jumlah','Status','Catatan'],...db.transactions.map(t=>[t.date,t.invoice,t.type==='in'?'Pemasukan':'Pengeluaran',t.note,t.category,customerName(t.customerId),t.amount,t.paid?'Lunas':'Belum lunas',t.memo])];download('kaskita-transaksi-'+today()+'.csv','\ufeff'+rows.map(r=>r.map(csvEscape).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV berhasil diunduh.')}
function importJSON(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.customers)||!Array.isArray(d.transactions)||!Array.isArray(d.agenda))throw Error();if(!confirm('Pulihkan backup akan mengganti seluruh data saat ini. Lanjutkan?'))return;db={...blank(),...d};db.products ||= [];save();render();toast('Backup berhasil dipulihkan.')}catch(err){alert('File backup tidak valid.')}e.target.value=''};r.readAsText(file)}
function clearData(){if(!confirm('Yakin hapus SEMUA pelanggan, transaksi, agenda, dan pengaturan? Unduh backup terlebih dahulu jika diperlukan.'))return;if(!confirm('Konfirmasi terakhir: data yang dihapus tidak bisa dikembalikan tanpa backup.'))return;db=blank();save();render();toast('Data lokal telah dihapus.')}
render();
</script>
<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(console.error));
}
</script>
